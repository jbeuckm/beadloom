# Apply pending database migrations whenever one lands on main.
# Needs the repository secret DATABASE_URL (the Neon connection string), and
# NEON_API_KEY + NEON_PROJECT_ID to refresh the Data API's schema cache after.
name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'scripts/migrate.mjs'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
